<h1>Cinema FMI - REST API</h1>

<p>Cererile GET pot fi deschise direct din browser:</p>
<ul>
    <li><a href="/api/movies">GET /api/movies</a></li>
    <li><a href="/api/movies/1">GET /api/movies/1</a></li>
    <li><a href="/api/movies/99">GET /api/movies/99</a></li>
    <li><a href="/api/movies?genre=Sci-Fi">GET /api/movies?genre=Sci-Fi</a></li>
</ul>

<p>Pentru POST, PUT si DELETE folositi fisierul <code>requests.http</code> din IntelliJ.</p>

</body>
