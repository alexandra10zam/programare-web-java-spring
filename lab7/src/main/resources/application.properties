spring.application.name=lab7

# Conexiunea la PostgreSQL: Spring Boot creeaza din aceste proprietati un DataSource.
# URL-ul JDBC: jdbc:<baza de date>://<server>:<port>/<numele bazei>
spring.datasource.url=jdbc:postgresql://localhost:5432/cinemadb
spring.datasource.username=${DB_USERNAME:postgres}
# Parola NU se scrie aici: vine din variabila de mediu DB_PASSWORD (Run -> Edit Configurations).
spring.datasource.password=${DB_PASSWORD}

# Daca portul 8080 este ocupat, decomentati linia de mai jos (si schimbati @baseUrl din requests.http).
# server.port=8081
