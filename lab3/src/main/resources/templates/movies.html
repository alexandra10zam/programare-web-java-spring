<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cinema FMI - Movies</title>
</head>
<body>

<h1>Cinema FMI</h1>
<h2>Now showing</h2>
<a th:href="@{/bookings/new}">Book tickets</a>
<br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Genre</th>
        <th>Price (RON)</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="movie : ${movies}">
        <td th:text="${movie.id}">1</td>
        <td th:text="${movie.title}">Example Movie</td>
        <td th:text="${movie.genre}">Example Genre</td>
        <td th:text="${movie.price}">0</td>
    </tr>
    </tbody>
</table>

</body>
</html>
