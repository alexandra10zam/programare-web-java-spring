<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cinema FMI - Book tickets</title>
</head>
<body>

<h1>Book tickets</h1>

<!-- th:object leaga formularul de obiectul "booking" din Model.
     Fiecare th:field="*{...}" corespunde unui camp din clasa Booking. -->
<form th:action="@{/bookings}"
      th:object="${booking}"
      method="post">

    <label>Your name:</label>
    <input type="text" th:field="*{clientName}" required />

    <br><br>

    <label>Movie:</label>
    <select th:field="*{movieId}">
        <option th:each="movie : ${movies}"
                th:value="${movie.id}"
                th:text="${movie.title + ' (' + movie.price + ' RON)'}">Movie</option>
    </select>

    <br><br>

    <label>Seats:</label>
    <input type="number" th:field="*{seats}" min="1" max="10" />

    <br><br>

    <button type="submit">Book</button>

</form>

<br>

<a th:href="@{/movies}">Back to movies</a>

</body>
</html>
